    // Grade Level Helper
    function getGradeDetails(score) {
      if (score >= 90) {
        return {
          medal: '🥇',
          label: 'Excellent / A+',
          short: 'A+',
          badgeBg: 'bg-amber-100 text-amber-900 border-amber-300',
          barColor: 'bg-amber-500',
        };
      }
      if (score >= 80) {
        return {
          medal: '🥈',
          label: 'Very Good / A',
          short: 'A',
          badgeBg: 'bg-slate-100 text-slate-800 border-slate-300',
          barColor: 'bg-slate-500',
        };
      }
      if (score >= 70) {
        return {
          medal: '🥉',
          label: 'Good / B',
          short: 'B',
          badgeBg: 'bg-orange-100 text-orange-900 border-orange-300',
          barColor: 'bg-orange-500',
        };
      }
      if (score >= 60) {
        return {
          medal: '⭐',
          label: 'Satisfactory / C',
          short: 'C',
          badgeBg: 'bg-blue-100 text-blue-900 border-blue-300',
          barColor: 'bg-blue-500',
        };
      }
      return {
        medal: '📌',
        label: 'Needs Improvement / D',
        short: 'D',
        badgeBg: 'bg-rose-100 text-rose-900 border-rose-300',
        barColor: 'bg-rose-500',
      };
    }

    // Status Badge Styling Helper
    function getStatusBadgeStyle(status) {
      const s = (status || '').toLowerCase();
      if (s.includes('select') || s.includes('approv') || s.includes('final')) {
        return 'bg-emerald-100 text-emerald-800 border-emerald-300';
      }
      if (s.includes('shortlist')) {
        return 'bg-indigo-100 text-indigo-800 border-indigo-300';
      }
      if (s.includes('practice') || s.includes('reject') || s.includes('hold')) {
        return 'bg-rose-100 text-rose-800 border-rose-300';
      }
      return 'bg-amber-100 text-amber-800 border-amber-300';
    }

    // Reusable Select Component with inline (+ Add / Edit / Remove) controls (Admin-only)
    function ManageableSelect({
      label,
      icon: IconComp,
      value,
      onChange,
      options,
      placeholder,
      isAdmin,
      onAdd,
      onEdit,
      onRemove,
      badgeSlot,
    }) {

        <div className="space-y-1.5">

          return 'grid';

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEYS.LAYOUT_MODE, layoutMode);
        } catch (e) {
          console.error(e);
        }
      }, [layoutMode]);

      const handleGlobalLayoutChange = (mode) => {
        setLayoutMode(mode);
        setCategoriesLayout(mode);
        setRecentEntriesLayout(mode);
      };

      // Persistent Lists
      const [evaluatorsList, setEvaluatorsList] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEYS.EVALUATORS);
          return saved ? JSON.parse(saved) : DEFAULT_EVALUATORS;

      // Open CRUD Modal (Admin-only)

      // Handle CRUD Submit
      const handleCrudSubmit = (e) => {
        e.preventDefault();
        const { mode, field, oldValue, value } = crudModal;
        const trimmed = value.trim();

        if (mode !== 'remove' && !trimmed) {
          showToast('Please enter a valid value.', 'error');
          return;
        }

        if (field === 'evaluator') {
          if (mode === 'add') {
            if (!evaluatorsList.some((x) => x.toLowerCase() === trimmed.toLowerCase())) {
              setEvaluatorsList((prev) => [...prev, trimmed]);
            }
            setActiveEvaluator(trimmed);
            showToast(`Added Evaluator "${trimmed}"`);
          } else if (mode === 'edit') {
            setEvaluatorsList((prev) =>
              prev.map((x) => (x === oldValue ? trimmed : x))
            );
            setEvaluations((prev) =>
              prev.map((ev) => (ev.evaluator === oldValue ? { ...ev, evaluator: trimmed } : ev))
            );
            if (activeEvaluator === oldValue) setActiveEvaluator(trimmed);
            if (filterEvaluator === oldValue) setFilterEvaluator(trimmed);
            showToast(`Renamed Evaluator "${oldValue}" to "${trimmed}"`);
          } else if (mode === 'remove') {
            setEvaluatorsList((prev) => prev.filter((x) => x !== oldValue));
            if (activeEvaluator === oldValue) {
              setActiveEvaluator('');
              if (activeView === 'workspace') setActiveView('evaluators');
            }
            if (filterEvaluator === oldValue) setFilterEvaluator('ALL');
            showToast(`Removed Evaluator "${oldValue}"`, 'info');
          }
        } else if (field === 'name') {
          if (mode === 'add') {
            if (!namesList.some((x) => x.toLowerCase() === trimmed.toLowerCase())) {
              setNamesList((prev) => [trimmed, ...prev]);
            }
            setSelectedName(trimmed);
            setNameStatusMap((prev) => ({
              ...prev,
              [trimmed]: prev[trimmed] || statusesList[0] || 'Pending',
            }));
            showToast(`Added "${trimmed}"`);
          } else if (mode === 'edit') {
            setNamesList((prev) => prev.map((x) => (x === oldValue ? trimmed : x)));
            setEvaluations((prev) =>
              prev.map((ev) => (ev.name === oldValue ? { ...ev, name: trimmed } : ev))
            );
            setNameStatusMap((prev) => {
              const copy = { ...prev };
              if (copy[oldValue]) {
                copy[trimmed] = copy[oldValue];
                delete copy[oldValue];
              }
              return copy;
            });
            if (selectedName === oldValue) setSelectedName(trimmed);
            if (filterName === oldValue) setFilterName(trimmed);
            showToast(`Renamed "${oldValue}" to "${trimmed}"`);
          } else if (mode === 'remove') {
            setNamesList((prev) => prev.filter((x) => x !== oldValue));
            if (selectedName === oldValue) setSelectedName('');
            if (filterName === oldValue) setFilterName('ALL');
            showToast(`Removed "${oldValue}"`, 'info');
          }
        } else if (field === 'zion') {
          if (mode === 'add') {
            if (!zionsList.some((x) => x.toLowerCase() === trimmed.toLowerCase())) {
              setZionsList((prev) => [...prev, trimmed]);

      // Total Marks & Grade
      const totalMarks = useMemo(() => {

      // Live Stats for Currently Selected Name
      const selectedNameLiveAnalytics = useMemo(() => {
        if (!selectedName) return null;
        const nameEvals = evaluations.filter(
          (ev) => ev.name.toLowerCase() === selectedName.toLowerCase()
        );
        const uniqueEvaluators = Array.from(new Set(nameEvals.map((e) => e.evaluator)));
        const existingSum = nameEvals.reduce((acc, item) => acc + item.total, 0);
        const existingCount = nameEvals.length;
        const existingAvg = existingCount > 0 ? existingSum / existingCount : 0;

        const otherEvals = nameEvals.filter((e) => e.id !== editingEvalId);
        const projectedCount = otherEvals.length + 1;
        const projectedSum =
          otherEvals.reduce((acc, item) => acc + item.total, 0) + totalMarks;
        const projectedAvg = projectedSum / projectedCount;

        return {
          status: nameStatusMap[selectedName] || selectedStatus || 'Pending',
          evaluatorCount: uniqueEvaluators.length,
          totalSubmissions: existingCount,
          evaluatorsList: uniqueEvaluators,
          existingSum,
          existingAvg: Number(existingAvg.toFixed(2)),
          existingPercent: Number(existingAvg.toFixed(1)),
          projectedAvg: Number(projectedAvg.toFixed(2)),

        showToast(`Editing Song #${entry.songNumber} for ${entry.name}`, 'info');

      const handleDeleteEvaluation = (id) => {

          showToast('Admin login required to remove saved marks.', 'error');

        if (editingEvalId === id) {
          setEditingEvalId(null);
          setMarks(initialMarks);

        showToast('Evaluation entry deleted.', 'info');
      };

      const activeEvaluatorSubmissions = useMemo(() => {
        return evaluations.filter((ev) => ev.evaluator === activeEvaluator);
      }, [evaluations, activeEvaluator]);

      const filteredEvaluations = useMemo(() => {
        return evaluations.filter((ev) => {
          const currentNameStatus = nameStatusMap[ev.name] || 'Pending';
          if (filterStatus !== 'ALL' && currentNameStatus !== filterStatus) return false;
          if (filterName !== 'ALL' && ev.name !== filterName) return false;
          if (filterZion !== 'ALL' && ev.zion !== filterZion) return false;
          if (filterBranch !== 'ALL' && ev.branch !== filterBranch) return false;
          if (filterEvaluator !== 'ALL' && ev.evaluator !== filterEvaluator) return false;
          if (
            filterSong.trim() !== '' &&
            !ev.songNumber.toString().includes(filterSong.trim())
          ) {
            return false;
          }
          if (filterDate !== 'ALL') {
            const dStr = ev.evalDate || (ev.createdAt ? ev.createdAt.slice(0, 10) : '');
            if (dStr !== filterDate) return false;
          }
          return true;
        });
      }, [
        evaluations,
        nameStatusMap,
        filterStatus,
        filterName,
        filterZion,
        filterBranch,
        filterEvaluator,
        filterSong,
        filterDate,
      ]);

      const aggregatedNamesSummary = useMemo(() => {
        const map = new Map();

        // If no evaluations exist yet or showing all teams
        if (
          filterZion === 'ALL' &&
          filterBranch === 'ALL' &&
          filterEvaluator === 'ALL' &&
          filterSong.trim() === '' &&
          filterDate === 'ALL'
        ) {
          namesList.forEach((n) => {
            const st = nameStatusMap[n] || 'Pending';
            if (filterStatus !== 'ALL' && st !== filterStatus) return;
            if (filterName !== 'ALL' && n !== filterName) return;

            const key = `unevaluated__${n}`;
            map.set(key, {
              key,
              name: n,
              songNumber: null,
              dateStr: null,
              displayDate: null,
              status: st,
              entries: [],
              totalScoreSum: 0,
              zions: new Set(),
              branches: new Set(),
              songs: new Set(),
              evaluators: new Set(),
            });
          });
        }

        filteredEvaluations.forEach((ev) => {
          const st = nameStatusMap[ev.name] || 'Pending';
          const dStr = ev.evalDate || (ev.createdAt ? ev.createdAt.slice(0, 10) : 'No-Date');

          let key;
          if (resultsGroupBy === 'song_date') {
            key = `${ev.name}__Song_${ev.songNumber}__Date_${dStr}`;
          } else if (resultsGroupBy === 'song') {
            key = `${ev.name}__Song_${ev.songNumber}`;
          } else {
            key = `team__${ev.name}`;
          }

          // If unevaluated placeholder exists for this team, remove it
          if (map.has(`unevaluated__${ev.name}`)) {
            map.delete(`unevaluated__${ev.name}`);
          }

          if (!map.has(key)) {
            map.set(key, {
              key,
              name: ev.name,
              songNumber: resultsGroupBy === 'team' ? null : ev.songNumber,
              dateStr: resultsGroupBy === 'song_date' ? dStr : null,
              displayDate: resultsGroupBy === 'song_date' ? formatDisplayDate(dStr) : null,
              status: st,
              entries: [],
              totalScoreSum: 0,
              zions: new Set(),
              branches: new Set(),
              songs: new Set(),
              evaluators: new Set(),
            });
          }

          const group = map.get(key);
          group.entries.push(ev);
          group.totalScoreSum += Number(ev.total) || 0;
          if (ev.zion) group.zions.add(ev.zion);
          if (ev.branch) group.branches.add(ev.branch);
          if (ev.songNumber) group.songs.add(ev.songNumber);
          if (ev.evaluator) group.evaluators.add(ev.evaluator);
        });

        const list = Array.from(map.values())
          .filter((g) => {
            if (
              filterZion !== 'ALL' ||
              filterBranch !== 'ALL' ||
              filterEvaluator !== 'ALL' ||
              filterSong.trim() !== '' ||
              filterDate !== 'ALL'
            ) {
              return g.entries.length > 0;
            }
            return true;
          })
          .map((g) => {
            const evalCount = g.entries.length;
            const uniqueEvaluatorsCount = g.evaluators.size;
            const avgMarks = evalCount > 0 ? g.totalScoreSum / evalCount : 0;
            const avgPercent = avgMarks;
            const gradeInfo =
              evalCount > 0 ? getGradeDetails(Math.round(avgMarks)) : null;

            return {
              key: g.key,
              name: g.name,
              songNumber: g.songNumber,
              dateStr: g.dateStr,
              displayDate: g.displayDate,
              status: g.status,
              evalCount,
              uniqueEvaluatorsCount,
              totalScoreSum: g.totalScoreSum,
              avgMarks: Number(avgMarks.toFixed(2)),
              avgPercent: Number(avgPercent.toFixed(1)),
              gradeInfo,
              zions: Array.from(g.zions).join(', ') || '—',
              branches: Array.from(g.branches).join(', ') || '—',
              songs: Array.from(g.songs).sort((a, b) => a - b),
              evaluators: Array.from(g.evaluators),
              entries: g.entries,
            };
          });

        return list.sort((a, b) => {
          if (b.evalCount > 0 && a.evalCount === 0) return 1;
          if (a.evalCount > 0 && b.evalCount === 0) return -1;
          if (a.dateStr && b.dateStr && a.dateStr !== b.dateStr) {
            return b.dateStr.localeCompare(a.dateStr);
          }
          return b.avgMarks - a.avgMarks || b.evalCount - a.evalCount;
        });
      }, [
        namesList,
        nameStatusMap,
        filteredEvaluations,
        filterStatus,
        filterName,
        filterZion,
        filterBranch,
        filterEvaluator,
        filterSong,
        filterDate,
        resultsGroupBy,
      ]);

      const handleExportCSV = () => {
        if (evaluations.length === 0) {
          showToast('No evaluation records to export.', 'error');
          return;
        }

        const headers = [
          'Date',
          'Evaluator',
          'Song Number',
          'Name (Person/Group/Team)',
          'Status',
          'Zion',
          'Branch',
          ...GRADING_CATEGORIES.map((c) => `${c.label} (${c.max})`),
          'Total Marks (100)',
          'Grade',
        ];

        const rows = evaluations.map((ev) => [
          `"${new Date(ev.createdAt).toLocaleString()}"`,
          `"${ev.evaluator.replace(/"/g, '""')}"`,
          `Song #${ev.songNumber}`,
          `"${ev.name.replace(/"/g, '""')}"`,
          `"${(nameStatusMap[ev.name] || 'Pending').replace(/"/g, '""')}"`,
          `"${ev.zion.replace(/"/g, '""')}"`,
          `"${ev.branch.replace(/"/g, '""')}"`,
          ...GRADING_CATEGORIES.map((c) => ev.marks[c.id] ?? 0),
          ev.total,
          `"${ev.grade}"`,
        ]);

        const summaryHeaders = [
          '',
          '--- COMBINED SUMMARY (BY TEAM, SONG & DATE) ---',
          'Date',
          'Song Number',
          'Name (Person/Group/Team)',
          'Status',
          'Evaluators Count',
          'Evaluator Names',
          'Combined Total Marks',
          'Max Possible Marks',
          'Average Marks (100)',
          'Average Percentage (%)',
          'Overall Grade',
          'Zion',
          'Branch',
        ];

        const summaryRows = aggregatedNamesSummary
          .filter((ag) => ag.evalCount > 0)
          .map((ag) => [
            '',
            `"${ag.displayDate || ag.dateStr || 'All Dates'}"`,
            ag.songNumber ? `Song #${ag.songNumber}` : (ag.songs && ag.songs.length > 0 ? ag.songs.map((s) => `#${s}`).join(' ') : '—'),
            `"${ag.name.replace(/"/g, '""')}"`,
            `"${ag.status.replace(/"/g, '""')}"`,
            ag.evalCount,
            `"${ag.evaluators.join(', ').replace(/"/g, '""')}"`,
            ag.totalScoreSum,
            ag.evalCount * 100,
            ag.avgMarks,
            `${ag.avgPercent}%`,
            `"${ag.gradeInfo ? ag.gradeInfo.label : 'Not Graded'}"`,
            `"${ag.zions.replace(/"/g, '""')}"`,
            `"${ag.branches.replace(/"/g, '""')}"`,
          ]);

        const csvContent =
          'data:text/csv;charset=utf-8,' +
          [
            headers.join(','),
            ...rows.map((r) => r.join(',')),
            '',
            summaryHeaders.join(','),
            ...summaryRows.map((r) => r.join(',')),
          ].join('\n');

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement('a');
        link.setAttribute('href', encodedUri);
        link.setAttribute(
          'download',
          `Choir_Grading_Summary_${new Date().toISOString().slice(0, 10)}.csv`
        );
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast('CSV report exported!');
      };

      const visibleEvaluators = useMemo(() => {
        const q = evaluatorSearch.trim().toLowerCase();
        if (!q) return evaluatorsList;
        return evaluatorsList.filter((ev) => ev.toLowerCase().includes(q));
      }, [evaluatorsList, evaluatorSearch]);

      // Calendar Calculations and Handlers
      // Timezone-safe local date string (YYYY-MM-DD)
      const getLocalDateStr = (val) => {
        if (!val) return '';
        try {
          const d = new Date(val);
          if (isNaN(d.getTime())) return typeof val === 'string' ? val.slice(0, 10) : '';
          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, '0');
          const day = String(d.getDate()).padStart(2, '0');
          return `${y}-${m}-${day}`;
        } catch {
          return typeof val === 'string' ? val.slice(0, 10) : '';
        }
      };

      const handleEditCalEvent = (ev) => {
        setCalEditingEventId(ev.id);
        setCalEventDate(ev.date);
        setCalEventTitle(ev.title);
        setCalEventName(ev.name || '');
        setCalEventZion(ev.zion || 'Nellore');
        setCalEventBranch(ev.branch || 'Main Branch');
        setCalEventTime(ev.time || '18:00');
        setCalEventNotes(ev.notes || '');
        setCalModalOpen(true);
      };

      const calMonthYearLabel = useMemo(() => {
        return calCurrentDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
      }, [calCurrentDate]);

      const calPrevMonth = () => {
        setCalCurrentDate((prev) => new Date(prev.getFullYear(), prev.getMonth() - 1, 1));
      };

      const calNextMonth = () => {
        setCalCurrentDate((prev) => new Date(prev.getFullYear(), prev.getMonth() + 1, 1));
      };

      const calJumpToday = () => {
        const today = new Date();
        setCalCurrentDate(today);
        const y = today.getFullYear();
        const m = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        setCalSelectedDateStr(`${y}-${m}-${day}`);
      };

      // Formatted date string helper
      const formatDisplayDate = (dStr) => {
        if (!dStr) return '';
        const parts = dStr.split('-');
        if (parts.length !== 3) return dStr;
        const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
        return d.toLocaleDateString('en-US', {
          weekday: 'short',
          day: 'numeric',
          month: 'short',
          year: 'numeric',
        });
      };

      // Calendar month days calculation
      const calMonthCells = useMemo(() => {
        const year = calCurrentDate.getFullYear();
        const month = calCurrentDate.getMonth();
        const firstDayOfWeek = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const daysInPrevMonth = new Date(year, month, 0).getDate();

        const today = new Date();
        const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

        const cells = [];
        // Previous month days padding
        for (let i = firstDayOfWeek - 1; i >= 0; i--) {
          const d = daysInPrevMonth - i;
          const m = month === 0 ? 12 : month;
          const y = month === 0 ? year - 1 : year;
          const dStr = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          cells.push({ dayNumber: d, dateStr: dStr, isCurrentMonth: false, isToday: dStr === todayStr });
        }
        // Current month days
        for (let d = 1; d <= daysInMonth; d++) {
          const dStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          cells.push({ dayNumber: d, dateStr: dStr, isCurrentMonth: true, isToday: dStr === todayStr });
        }
        // Next month days padding
        const remaining = (7 - (cells.length % 7)) % 7;
        for (let d = 1; d <= remaining; d++) {
          const m = month + 2 > 12 ? 1 : month + 2;
          const y = month + 2 > 12 ? year + 1 : year;
          const dStr = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          cells.push({ dayNumber: d, dateStr: dStr, isCurrentMonth: false, isToday: dStr === todayStr });
        }
        return cells;
      }, [calCurrentDate]);

      // Mapped evaluations by date
      const calEvaluationsByDate = useMemo(() => {
        const map = {};
        evaluations.forEach((item) => {
          if (calFilterName !== 'ALL' && item.name !== calFilterName) return;
          if (calFilterZion !== 'ALL' && item.zion !== calFilterZion) return;
          if (calFilterEvaluator !== 'ALL' && item.evaluator !== calFilterEvaluator) return;

          const dateStr = item.evalDate || getLocalDateStr(item.createdAt || item.updatedAt);
          if (!dateStr) return;
          if (!map[dateStr]) map[dateStr] = [];
          map[dateStr].push(item);
        });
        return map;
      }, [evaluations, calFilterName, calFilterZion, calFilterEvaluator]);

      // Mapped events by date
      const calEventsByDate = useMemo(() => {
        const map = {};
        calendarEvents.forEach((ev) => {
          if (calFilterName !== 'ALL' && ev.name && ev.name !== calFilterName) return;
          if (calFilterZion !== 'ALL' && ev.zion && ev.zion !== calFilterZion) return;

          const dateStr = ev.date;
          if (!dateStr) return;
          if (!map[dateStr]) map[dateStr] = [];
          map[dateStr].push(ev);
        });
        return map;
      }, [calendarEvents, calFilterName, calFilterZion]);

      // Selected date lists
      const calSelectedDateEvals = useMemo(() => {
        return calEvaluationsByDate[calSelectedDateStr] || [];
      }, [calEvaluationsByDate, calSelectedDateStr]);

      const calSelectedDateEvents = useMemo(() => {
        return calEventsByDate[calSelectedDateStr] || [];
      }, [calEventsByDate, calSelectedDateStr]);

      // Month stats
      const calMonthStats = useMemo(() => {
        const currentPrefix = `${calCurrentDate.getFullYear()}-${String(calCurrentDate.getMonth() + 1).padStart(2, '0')}`;
        const evalsThisMonth = evaluations.filter((e) => (e.evalDate || getLocalDateStr(e.createdAt || e.updatedAt)).startsWith(currentPrefix));
        const eventsThisMonth = calendarEvents.filter((ev) => (ev.date || '').startsWith(currentPrefix));
        const avgScore = evalsThisMonth.length > 0
          ? (evalsThisMonth.reduce((acc, curr) => acc + (Number(curr.total) || 0), 0) / evalsThisMonth.length).toFixed(1)
          : null;
        const activeDaysCount = new Set(evalsThisMonth.map((e) => e.evalDate || getLocalDateStr(e.createdAt || e.updatedAt))).size;

        return {
          evalCount: evalsThisMonth.length,
          eventCount: eventsThisMonth.length,
          avgScore,
          activeDaysCount,
        };
      }, [evaluations, calendarEvents, calCurrentDate]);

      // Agenda list of all dates with evaluations or events
      const calAgendaDates = useMemo(() => {
        const dateSet = new Set([
          ...Object.keys(calEvaluationsByDate),
          ...Object.keys(calEventsByDate),
        ]);
        return Array.from(dateSet).sort().reverse();
      }, [calEvaluationsByDate, calEventsByDate]);

      // Schedule Event Handlers
      const handleOpenAddEventModal = (targetDateStr = null) => {
        const d = targetDateStr || calSelectedDateStr || new Date().toISOString().slice(0, 10);
        setCalEditingEventId(null);
        setCalEventDate(d);
        setCalEventTitle('Choir Practice');
        setCalEventName(namesList[0] || '');
        setCalEventZion(zionsList[0] || 'Nellore');
        setCalEventBranch(branchesList[0] || 'Main Branch');
        setCalEventTime('18:00');
        setCalEventNotes('');
        setCalModalOpen(true);
      };

      const handleSaveCalEvent = (e) => {
        e.preventDefault();
        if (!calEventDate) {
          showToast('Please select a date for the event.', 'error');
          return;
        }
        if (!calEventTitle.trim()) {
          showToast('Please enter an event title.', 'error');
          return;
        }

        if (calEditingEventId) {
          setCalendarEvents((prev) =>
            prev.map((ev) =>
              ev.id === calEditingEventId
                ? {
                    ...ev,
                    date: calEventDate,
                    title: calEventTitle.trim(),
                    name: calEventName,
                    zion: calEventZion,
                    branch: calEventBranch,
                    time: calEventTime,
                    notes: calEventNotes.trim(),
                    updatedAt: new Date().toISOString(),
                  }
                : ev
            )
          );
          showToast('Scheduled event updated!');
        } else {
          const newEvent = {
            id: `event_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
            date: calEventDate,
            title: calEventTitle.trim(),
            name: calEventName,
            zion: calEventZion,
            branch: calEventBranch,
            time: calEventTime,
            notes: calEventNotes.trim(),
            completed: false,
            createdAt: new Date().toISOString(),
          };
          setCalendarEvents((prev) => [newEvent, ...prev]);
          showToast('Choir event scheduled successfully!');
        }

        setCalModalOpen(false);
      };

      const handleToggleEventCompleted = (eventId) => {
        setCalendarEvents((prev) =>
          prev.map((ev) => (ev.id === eventId ? { ...ev, completed: !ev.completed } : ev))
        );
      };

      const handleDeleteCalEvent = (eventId) => {
        setCalendarEvents((prev) => prev.filter((ev) => ev.id !== eventId));
        showToast('Event removed from calendar.', 'info');
      };

      const handleJumpToGrading = (evalEntry) => {
        setActiveEvaluator(evalEntry.evaluator);
        setSelectedName(evalEntry.name);
        setSelectedZion(evalEntry.zion);
        setSelectedBranch(evalEntry.branch);
        setSongNumber(evalEntry.songNumber);
        setActiveView('workspace');
        showToast(`Switched to grading workspace for ${evalEntry.name} (Song #${evalEntry.songNumber})`);
      };

      return (
        <div className="min-h-screen bg-slate-50 text-slate-900 pb-24">
          {/* Top App Header */}
          <header className="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 shadow-xs">
            <div className="max-w-5xl mx-auto px-4 py-3 flex flex-col gap-3">
              <div className="flex flex-wrap items-center justify-between gap-2.5">
                <div
                  onClick={() => setActiveView('evaluators')}
                  className="flex items-center gap-2.5 cursor-pointer"
                >
                  <div className="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center shadow-md shadow-indigo-200 shrink-0">
                    <Icons.Music className="w-5 h-5" />
                  </div>
                  <div>
                    <h1 className="text-lg sm:text-xl font-bold tracking-tight text-slate-900 leading-tight">
                      Choir Grading – 100 Marks
                    </h1>
                    <p className="text-xs text-slate-500">
                      Evaluators • Songs 1–485 • Status &amp; Combined Averages
                    </p>
                  </div>
                </div>

                {/* Global View Toggle & Admin Login */}
                <div className="flex flex-wrap items-center gap-2">
                  <ViewModeToggle
                    mode={layoutMode}
                    onChange={handleGlobalLayoutChange}
                    label="View"
                  />
                  {isAdmin ? (
                    <>
                      <span className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-emerald-50 border border-emerald-300 text-emerald-800 text-xs font-extrabold">

                      <button

                    <button

                      className="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 active:scale-95 text-white text-xs font-bold shadow-xs transition"
                    >
                      <Icons.Lock className="w-3.5 h-3.5 text-amber-400" />

              </div>

              {/* 3-Step Primary Navigation Tabs */}
              <nav className="flex bg-slate-100 p-1 rounded-xl border border-slate-200 w-full">
                <button
                  type="button"
                  onClick={() => setActiveView('evaluators')}
                  className={`flex-1 md:flex-initial flex items-center justify-center gap-1.5 px-3 py-2 rounded-lg text-xs sm:text-sm font-bold transition-all ${
                    activeView === 'evaluators'

                >
                  <Icons.UserCheck className="w-4 h-4" />

                    {evaluatorsList.length}

                </button>

                <button
                  type="button"

                      setActiveEvaluator(evaluatorsList[0]);
                    }
                    setActiveView('workspace');
                  }}
                  className={`flex-1 md:flex-initial flex items-center justify-center gap-1.5 px-3 py-2 rounded-lg text-xs sm:text-sm font-bold transition-all ${
                    activeView === 'workspace'
                      ? 'bg-white text-indigo-700 shadow-xs'
                      : 'text-slate-600 hover:text-slate-900'

                >

                <button

                    activeView === 'results'
                      ? 'bg-white text-indigo-700 shadow-xs'

                >
                  <Icons.BarChart3 className="w-4 h-4" />
                  <span>3. Names &amp; Avg</span>

                <button

                      : 'text-slate-600 hover:text-slate-900'
                  }`}
                >
                  <Icons.Calendar className="w-4 h-4" />
                  <span>4. Calendar Tracker</span>
                  {(evaluations.length > 0 || calendarEvents.length > 0) && (

                      {evaluations.length + calendarEvents.length}
                    </span>
                  )}
                </button>
              </nav>
            </div>
          </header>

          {/* Toast Notification Banner */}
          {toast && (
            <div className="fixed top-16 left-1/2 -translate-x-1/2 z-50 w-[92%] max-w-md">
              <div
                className={`flex items-center justify-between gap-3 px-4 py-3 rounded-xl shadow-lg border text-sm font-medium ${
                  toast.type === 'error'
                    ? 'bg-rose-600 text-white border-rose-700'
                    : toast.type === 'info'
                    ? 'bg-slate-800 text-white border-slate-700'
                    : 'bg-emerald-600 text-white border-emerald-700'
                }`}
              >
                <div className="flex items-center gap-2">
                  {toast.type === 'error' ? (
                    <Icons.AlertCircle className="w-4 h-4 shrink-0" />
                  ) : (
                    <Icons.CheckCircle2 className="w-4 h-4 shrink-0" />
                  )}
                  <span>{toast.message}</span>
                </div>
                <button
                  type="button"
                  onClick={() => setToast(null)}
                  className="p-1 rounded-lg hover:bg-white/20"
                >
                  <Icons.X className="w-4 h-4" />
                </button>
              </div>
            </div>
          )}

          {/* Main Content */}
          <main className="max-w-5xl mx-auto px-3 sm:px-4 pt-5 space-y-5">
            {/* VIEW 1: EVALUATORS LIST */}
            {activeView === 'evaluators' && (
              <div className="space-y-5">
                <section className="bg-white rounded-2xl border border-slate-200 shadow-xs p-5 space-y-4">

                      <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-indigo-50 text-indigo-700 text-xs font-bold mb-1.5">
                        <Icons.ShieldCheck className="w-3.5 h-3.5" />
                        Step 1: Select or Manage Evaluators
                      </span>
                      <h2 className="text-xl font-extrabold text-slate-900">
                        Evaluators List
                      </h2>
                      <p className="text-sm text-slate-500">

                      </p>
                    </div>

                    <div className="flex flex-wrap items-center gap-2 shrink-0">
                      <ViewModeToggle

                      {isAdmin && (

                              'e.g., Pastor John / Judge 4'
                            )
                          }
                          className="inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white text-sm font-bold shadow-md shadow-indigo-200 transition"
                        >
                          <Icons.Plus className="w-4 h-4" />

                  <div className="relative">

                    <input
                      type="text"
                      value={evaluatorSearch}

                      Event Date
                    </label>
                    <input
                      type="date"
                      value={calEventDate}
                      onChange={(e) => setCalEventDate(e.target.value)}
                      className="w-full text-xs font-semibold px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-hidden"
                      required
                    />
                  </div>

                  {/* Title */}
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
                      Event Title / Type
                    </label>
                    <input
                      type="text"
                      value={calEventTitle}
                      onChange={(e) => setCalEventTitle(e.target.value)}
                      placeholder="e.g. Choir Practice, Sunday Rehearsal, Audition"
                      className="w-full text-xs font-semibold px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-hidden"
                      required
                    />
                  </div>

                  {/* Choir Selection */}
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
                      Choir / Team
                    </label>
                    <select
                      value={calEventName}
                      onChange={(e) => setCalEventName(e.target.value)}
                      className="w-full text-xs font-semibold px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-hidden"
                    >
                      <option value="">All / General Choir</option>
                      {namesList.map((n) => (
                        <option key={n} value={n}>{n}</option>
                      ))}
                    </select>
                  </div>

                  {/* Zion & Time Grid */}
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
                        Zion
                      </label>
                      <select
                        value={calEventZion}
                        onChange={(e) => setCalEventZion(e.target.value)}
                        className="w-full text-xs font-semibold px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-hidden"
                      >
                        {zionsList.map((z) => (
                          <option key={z} value={z}>{z}</option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
                        Time
                      </label>
                      <input
                        type="time"
                        value={calEventTime}
                        onChange={(e) => setCalEventTime(e.target.value)}
                        className="w-full text-xs font-semibold px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-hidden"
                      />
                    </div>
                  </div>

                  {/* Notes */}
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
                      Notes / Songs to Practice
                    </label>
                    <textarea
                      value={calEventNotes}
                      onChange={(e) => setCalEventNotes(e.target.value)}
                      placeholder="e.g. Practice Song #23 and #45, focus on soprano parts"
                      rows={2}
                      className="w-full text-xs font-semibold px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-hidden"
                    />
                  </div>

                  {/* Buttons */}
                  <div className="flex items-center justify-end gap-2 pt-2 border-t border-slate-100">
                    <button
                      type="button"
                      onClick={() => setCalModalOpen(false)}
                      className="px-4 py-2 text-xs font-bold text-slate-600 hover:text-slate-800"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold shadow-xs transition-all"
                    >
                      {calEditingEventId ? 'Save Changes' : 'Save Event'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Admin Login Modal */}
          {adminModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl border border-slate-200 shadow-2xl w-full max-w-sm overflow-hidden">
                <div className="px-5 py-4 bg-slate-900 text-white flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <Icons.Lock className="w-4 h-4 text-amber-400" />
                    <h3 className="font-bold text-base">Admin Login</h3>
                  </div>
                  <button
                    type="button"
                    onClick={() => setAdminModalOpen(false)}
                    className="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-white/10"
                  >
                    <Icons.X className="w-4 h-4" />
                  </button>
                </div>

                <form onSubmit={handleAdminLoginSubmit} className="p-5 space-y-4">
                  <p className="text-xs text-slate-500">
                    Sign in with Admin credentials to unlock Add, Edit, and Remove controls across the app.
                  </p>

                  {adminLoginError && (
                    <div className="p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-semibold flex items-center gap-2">
                      <Icons.AlertCircle className="w-4 h-4 shrink-0" />
                      <span>{adminLoginError}</span>
                    </div>
                  )}

                  <div className="space-y-1.5">
                    <label className="block text-xs font-bold uppercase tracking-wider text-slate-600">
                      Admin ID
                    </label>
                    <input
                      type="text"
                      autoFocus
                      required
                      value={adminIdInput}
                      onChange={(e) => {
                        setAdminIdInput(e.target.value);
                        if (adminLoginError) setAdminLoginError('');
                      }}
                      placeholder="Enter Admin ID"
                      className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white"
                    />
                  </div>

                  <div className="space-y-1.5">
                    <label className="block text-xs font-bold uppercase tracking-wider text-slate-600">
                      Password
                    </label>
                    <div className="relative">
                      <input
                        type={showAdminPassword ? 'text' : 'password'}
                        required
                        value={adminPasswordInput}
                        onChange={(e) => {
                          setAdminPasswordInput(e.target.value);
                          if (adminLoginError) setAdminLoginError('');
                        }}
                        placeholder="Enter Password"
                        className="w-full pl-3.5 pr-10 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white"
                      />
                      <button
                        type="button"
                        onClick={() => setShowAdminPassword((prev) => !prev)}
                        className="p-1.5 text-slate-400 hover:text-slate-700 absolute right-2 top-1/2 -translate-y-1/2"
                        title={showAdminPassword ? 'Hide password' : 'Show password'}
                      >
                        {showAdminPassword ? (
                          <Icons.EyeOff className="w-4 h-4" />
                        ) : (
                          <Icons.Eye className="w-4 h-4" />
                        )}
                      </button>
                    </div>
                  </div>

                  <div className="flex items-center justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setAdminModalOpen(false)}
                      className="px-4 py-2 rounded-xl border border-slate-300 text-sm font-semibold text-slate-700 hover:bg-slate-50"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold shadow-xs"
                    >
                      Login as Admin
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Reusable Add / Edit / Remove Modal Dialog (Admin Only) */}
          {isAdmin && crudModal.open && (
            <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl border border-slate-200 shadow-xl w-full max-w-md overflow-hidden">
                <div className="px-5 py-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
                  <h3 className="font-bold text-slate-900">{crudModal.title}</h3>
                  <button
                    type="button"
                    onClick={() =>
                      setCrudModal({
                        open: false,
                        mode: 'add',
                        field: null,
                        title: '',
                        placeholder: '',
                        oldValue: '',
                        value: '',
                      })
                    }
                    className="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-200/70"
                  >
                    <Icons.X className="w-4 h-4" />
                  </button>
                </div>

                <form onSubmit={handleCrudSubmit} className="p-5 space-y-4">
                  {crudModal.mode === 'remove' ? (
                    <div className="space-y-2">
                      <p className="text-sm text-slate-700">
                        Are you sure you want to remove{' '}
                        <strong className="text-rose-700">&ldquo;{crudModal.oldValue}&rdquo;</strong>{' '}
                        from the dropdown list?
                      </p>
                      <p className="text-xs text-slate-500">
                        Existing saved marks history will remain safe in your records.
                      </p>
                    </div>
                  ) : (
                    <div>
                      <label className="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">
                        {crudModal.mode === 'edit'
                          ? `Rename "${crudModal.oldValue}" to:`
                          : 'Enter Name'}
                      </label>
                      <input
                        type="text"
                        autoFocus
                        value={crudModal.value}
                        onChange={(e) =>
                          setCrudModal((prev) => ({ ...prev, value: e.target.value }))
                        }
                        placeholder={crudModal.placeholder}
                        className="w-full px-3.5 py-2.5 bg-white border border-slate-300 rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      />
                    </div>
                  )}

                  <div className="flex items-center justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() =>
                        setCrudModal({
                          open: false,
                          mode: 'add',
                          field: null,
                          title: '',
                          placeholder: '',
                          oldValue: '',
                          value: '',
                        })
                      }
                      className="px-4 py-2 rounded-xl border border-slate-300 text-sm font-semibold text-slate-700 hover:bg-slate-50"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className={`px-4 py-2 rounded-xl text-white text-sm font-bold shadow-xs ${
                        crudModal.mode === 'remove'
                          ? 'bg-rose-600 hover:bg-rose-700'
                          : 'bg-indigo-600 hover:bg-indigo-700'
                      }`}
                    >
                      {crudModal.mode === 'remove'
                        ? 'Yes, Remove'
                        : crudModal.mode === 'edit'
                        ? 'Save Changes'
                        : 'Add & Select'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
